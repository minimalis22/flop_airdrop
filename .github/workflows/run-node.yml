name: run-node-job

on:
  workflow_dispatch:

jobs:
  run-node-job:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع باستخدام أحدث إصدار متوافق
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js وتحديث الإصدار إلى 24 لتجنب التحذير
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # تم التحديث من 20 إلى 24

      # 3. تثبيت المكتبات (إن وجدت) وتشغيل السكربت الخاص بك
      - name: Install dependencies and run script
        run: |
          npm install
          node node.mjs
